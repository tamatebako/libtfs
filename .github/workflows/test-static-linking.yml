name: Test Static Linking Without Folly/Thrift

on:
  push:
    branches:
      - main
      - stage-1-modernize-libtfs
  pull_request:
    branches:
      - main

concurrency:
  group: '${{ github.workflow }}-${{ github.job }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

env:
  # Pin from vcpkg-configuration.json default-registry baseline
  VCPKG_COMMIT: 11bbc873e00e9e58d4e9dffb30b7a5493a030e0b

jobs:
  test-static-linking:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install fixture tools (Ubuntu)
        # zip and mksquashfs are needed by tests/fixtures/regenerate_all.sh
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zip squashfs-tools

      - name: Install fixture tools (macOS)
        if: runner.os == 'macOS'
        run: brew install squashfs

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          runVcpkgInstall: false

      - name: Cache vcpkg installed tree
        uses: actions/cache@v4
        with:
          path: build/vcpkg_installed
          key: vcpkg-installed-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlay/**') }}
          restore-keys: vcpkg-installed-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure CMake (vcpkg toolchain)
        # All dependencies (dwarfs-t, squashfs-tools-ng, libzip, argtable3,
        # gtest) come from the vcpkg manifest; the dwarfs-t port is built
        # without folly/thrift.
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Verify CMake configuration
        # Fail if folly/thrift show up as enabled options or as libraries in
        # the CMake cache. (Lines merely mentioning folly/thrift without a
        # library path or an ON value are not dependencies.)
        run: |
          echo "=== Verifying NO folly/thrift in configuration ==="
          if grep -iE "folly|thrift" build/CMakeCache.txt | grep -E ":BOOL=ON|/lib[^ ;]*\.(a|so|dylib|lib)"; then
            echo "ERROR: Found folly/thrift as enabled option or library in CMake configuration"
            exit 1
          fi

          echo "Configuration verified: No folly/thrift dependencies"

      - name: Build project
        run: cmake --build build --parallel

      - name: Regenerate test fixtures
        # Test fixtures (*.zip/*.dwarfs/*.sqfs) are gitignored and must be
        # recreated. mkdwarfs comes from the vcpkg build (dwarfs WITH_TOOLS=ON);
        # fixtures are copied into the build tree by CMake at configure time,
        # so re-run configure to pick up the fresh ones.
        run: |
          bash tests/fixtures/regenerate_all.sh
          MKDWARFS_DIR=$(dirname "$(ls build/vcpkg_installed/*/bin/mkdwarfs | head -1)")
          PATH="$PWD/$MKDWARFS_DIR:$PATH" bash tests/fixtures/dwarfs/create_fixtures.sh
          cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Release

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --parallel

      - name: Verify no folly symbols in binaries (Linux)
        if: runner.os == 'Linux'
        # Use nm to check for folly namespace symbols in compiled objects.
        # Only our own build products are scanned (vcpkg_installed contains
        # third-party static libraries and is skipped).
        run: |
          echo "=== Checking for folly symbols in object files ==="
          found_folly=0

          for obj in $(find build -path build/vcpkg_installed -prune -o \( -name "*.o" -o -name "*.so" -o -name "*.a" \) -print 2>/dev/null); do
            if nm -C "$obj" 2>/dev/null | grep -i "folly::"; then
              echo "ERROR: Found folly symbols in $obj"
              found_folly=1
            fi
          done

          if [ $found_folly -eq 1 ]; then
            echo "ERROR: Folly symbols detected in binaries"
            exit 1
          fi

          echo "No folly symbols found in binaries"

      - name: Verify no folly symbols in binaries (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "=== Checking for folly symbols in object files ==="
          found_folly=0

          for obj in $(find build -path build/vcpkg_installed -prune -o \( -name "*.o" -o -name "*.dylib" -o -name "*.a" \) -print 2>/dev/null); do
            if nm -C "$obj" 2>/dev/null | grep -i "folly::"; then
              echo "ERROR: Found folly symbols in $obj"
              found_folly=1
            fi
          done

          if [ $found_folly -eq 1 ]; then
            echo "ERROR: Folly symbols detected in binaries"
            exit 1
          fi

          echo "No folly symbols found in binaries"

      - name: Verify no thrift symbols in binaries (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "=== Checking for thrift symbols in object files ==="
          found_thrift=0

          for obj in $(find build -path build/vcpkg_installed -prune -o \( -name "*.o" -o -name "*.so" -o -name "*.a" \) -print 2>/dev/null); do
            if nm -C "$obj" 2>/dev/null | grep -i "apache::thrift"; then
              echo "ERROR: Found thrift symbols in $obj"
              found_thrift=1
            fi
          done

          if [ $found_thrift -eq 1 ]; then
            echo "ERROR: Thrift symbols detected in binaries"
            exit 1
          fi

          echo "No thrift symbols found in binaries"

      - name: Verify no thrift symbols in binaries (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "=== Checking for thrift symbols in object files ==="
          found_thrift=0

          for obj in $(find build -path build/vcpkg_installed -prune -o \( -name "*.o" -o -name "*.dylib" -o -name "*.a" \) -print 2>/dev/null); do
            if nm -C "$obj" 2>/dev/null | grep -i "apache::thrift"; then
              echo "ERROR: Found thrift symbols in $obj"
              found_thrift=1
            fi
          done

          if [ $found_thrift -eq 1 ]; then
            echo "ERROR: Thrift symbols detected in binaries"
            exit 1
          fi

          echo "No thrift symbols found in binaries"

      - name: Verify static linking
        # Check that test executables do not link folly/thrift dynamically.
        # For Linux: use ldd; for macOS: use otool.
        run: |
          echo "=== Verifying static linking ==="

          if [ "$RUNNER_OS" == "Linux" ]; then
            for exe in $(find build -maxdepth 1 -type f -name "test_*" -executable 2>/dev/null); do
              echo "Checking dependencies for: $exe"
              if ldd "$exe" | grep -iE "folly|thrift"; then
                echo "ERROR: $exe links folly/thrift dynamically"
                exit 1
              fi
            done
          elif [ "$RUNNER_OS" == "macOS" ]; then
            for exe in $(find build -maxdepth 1 -type f -name "test_*" -perm +111 2>/dev/null); do
              echo "Checking dependencies for: $exe"
              if otool -L "$exe" | grep -iE "folly|thrift"; then
                echo "ERROR: $exe links folly/thrift dynamically"
                exit 1
              fi
            done
          fi

          echo "Static linking verification complete"

      - name: Report results
        if: always()
        run: |
          echo "================================"
          echo "Static Linking Test Results"
          echo "================================"
          echo "OS: ${{ matrix.os }}"
          echo "Build Status: ${{ job.status }}"
          echo ""
          echo "Verified: no folly/thrift in CMake configuration,"
          echo "binaries, or dynamic dependencies."
