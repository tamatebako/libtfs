name: MacOS

on:
  schedule:
    - cron: "0 7 * * 0"
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.job }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

env:
  # Pin from vcpkg-configuration.json default-registry baseline
  VCPKG_COMMIT: 11bbc873e00e9e58d4e9dffb30b7a5493a030e0b
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 = arm64, macos-15-intel = x86_64
        os: [ macos-14, macos-15-intel ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install fixture tools
        # zip is preinstalled; mksquashfs is needed by
        # tests/fixtures/regenerate_all.sh (the vcpkg overlay ships
        # libraries only, not the CLI tools)
        run: brew install squashfs

      - name: Install mistletoe
        # The vcpkg dwarfs build generates tools man pages with the mistletoe
        # Python module. The runner's Homebrew python3 is PEP 668
        # externally-managed (pip --user fails, and dwarfs' own
        # ensure_mistletoe.cmake fallback cannot help), so install system-wide
        # with --break-system-packages; no brew formula exists.
        run: python3 -m pip install --break-system-packages mistletoe

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          runVcpkgInstall: false

      # Per-package ABI cache: port bumps rebuild only the changed port, not the world.
      - name: Cache vcpkg package archives
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-archives-${{ runner.os }}-${{ matrix.os }}-${{ hashFiles('vcpkg-configuration.json') }}
          restore-keys: vcpkg-archives-${{ runner.os }}-${{ matrix.os }}-

      - name: Cache vcpkg installed tree
        uses: actions/cache@v4
        with:
          path: build/vcpkg_installed
          key: vcpkg-installed-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlay/**') }}
          restore-keys: vcpkg-installed-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Regenerate test fixtures
        # Test fixtures (*.zip/*.dwarfs/*.sqfs) are gitignored and must be
        # recreated. mkdwarfs comes from the vcpkg build (dwarfs WITH_TOOLS=ON);
        # fixtures are copied into the build tree by CMake at configure time,
        # so re-run configure to pick up the fresh ones.
        run: |
          bash tests/fixtures/regenerate_all.sh
          MKDWARFS_DIR=$(dirname "$(ls build/vcpkg_installed/*/bin/mkdwarfs | head -1)")
          PATH="$PWD/$MKDWARFS_DIR:$PATH" bash tests/fixtures/dwarfs/create_fixtures.sh
          cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Release

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure --parallel
