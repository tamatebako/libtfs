name: Windows

on:
  schedule:
    - cron: "0 5 * * 0"
  push:
    branches: [ main, stage-1-modernize-libtfs ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.job }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

env:
  # Pin from vcpkg-configuration.json default-registry baseline
  VCPKG_COMMIT: 11bbc873e00e9e58d4e9dffb30b7a5493a030e0b

jobs:
  build:
    name: windows-latest (MSVC, x64-windows-static)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set MSVC Dev Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          runVcpkgInstall: false

      - name: Cache vcpkg installed tree
        uses: actions/cache@v4
        with:
          path: build/vcpkg_installed
          key: vcpkg-installed-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlay/**') }}
          restore-keys: vcpkg-installed-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure
        shell: bash
        run: cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/build/vcpkg_installed" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Setup MSYS2 (fixture tools)
        # zip and mksquashfs for tests/fixtures/regenerate_all.sh; the vcpkg
        # overlay ships libraries only, not the CLI tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          path-type: minimal
          update: false
          install: >-
            zip
            squashfs-tools

      - name: Regenerate test fixtures
        # Test fixtures (*.zip/*.dwarfs/*.sqfs) are gitignored and must be
        # recreated. mkdwarfs comes from the vcpkg build (dwarfs WITH_TOOLS=ON);
        # fixtures are copied into the build tree by CMake at configure time,
        # so configure is re-run afterwards to pick up the fresh ones.
        shell: msys2 {0}
        run: |
          bash tests/fixtures/regenerate_all.sh
          MKDWARFS_DIR=$(dirname "$(ls build/vcpkg_installed/*/bin/mkdwarfs.exe | head -1)")
          PATH="$PWD/$MKDWARFS_DIR:$PATH" bash tests/fixtures/dwarfs/create_fixtures.sh

      - name: Refresh fixtures in build tree
        shell: bash
        run: cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/build/vcpkg_installed" -DCMAKE_BUILD_TYPE=Release

      - name: Run unit tests
        shell: bash
        run: ctest --test-dir build --output-on-failure --parallel
