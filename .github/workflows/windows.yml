#
# Windows lane: MSYS2 UCRT64 (MinGW-w64 gcc), vcpkg triplet x64-mingw-static.
# MSYS2 UCRT64 is tebako's actual Windows packaging target (see tebako CI
# windows-msys.yml). MSVC support is a deferred decision: the legacy tebako
# API (src/c_helpers/tebako-dirent-helper.c, include/tebako-pch.h) is
# MinGW-lineage code (libdwarfs-wr / RB_W32 heritage) that relies on POSIX
# facilities (mode_t, <dlfcn.h>) for which no MSVC shim layer exists, and
# writing one is out of Stage-1 scope.

name: Windows

on:
  schedule:
    - cron: "0 5 * * 0"
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.job }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

env:
  # Pin from vcpkg-configuration.json default-registry baseline
  VCPKG_COMMIT: 11bbc873e00e9e58d4e9dffb30b7a5493a030e0b
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite

jobs:
  build:
    name: windows-latest (MSYS2 UCRT64, x64-mingw-static)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          runVcpkgInstall: false

      # Per-package ABI cache: port bumps rebuild only the changed port, not the world.
      - name: Cache vcpkg package archives
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-archives-${{ runner.os }}-${{ runner.arch }}-mingw-${{ hashFiles('vcpkg-configuration.json') }}
          restore-keys: vcpkg-archives-${{ runner.os }}-${{ runner.arch }}-mingw-

      - name: Cache vcpkg installed tree
        uses: actions/cache@v4
        with:
          path: build/vcpkg_installed
          key: vcpkg-installed-${{ runner.os }}-${{ runner.arch }}-mingw-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlay/**') }}
          restore-keys: vcpkg-installed-${{ runner.os }}-${{ runner.arch }}-mingw-

      - name: Setup MSYS2 (UCRT64 toolchain)
        # Build toolchain (UCRT64 gcc/cmake/ninja) plus zip and mksquashfs for
        # tests/fixtures/regenerate_all.sh; the vcpkg overlay ships libraries
        # only, not the CLI tools. vcpkg needs git on PATH for the git
        # default-registry baseline. dlfcn provides <dlfcn.h> for
        # include/tebako-pch.h (mingw-w64 base doesn't ship it). python-pip is
        # needed for the mistletoe install below (MSYS2 ships no
        # python-mistletoe package for UCRT64).
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: minimal
          update: true
          install: >-
            base-devel
            git
            tar
            zip
            squashfs-tools
          pacboy: >-
            toolchain:p
            ninja:p
            cmake:p
            dlfcn:p
            python-pip:p

      - name: Install mistletoe (dwarfs tools man pages)
        # The vcpkg dwarfs build generates tools man pages with the mistletoe
        # Python module; install it via pip into the UCRT64 python3 the build
        # invokes (matches macos.yml/alpine.yml/test-static-linking.yml).
        shell: msys2 {0}
        run: python3 -m pip install --break-system-packages mistletoe

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$(cygpath -m "$VCPKG_ROOT")/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-mingw-static \
            -DVCPKG_INSTALLED_DIR="$(cygpath -m "$GITHUB_WORKSPACE")/build/vcpkg_installed" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --parallel

      - name: Regenerate test fixtures
        # Test fixtures (*.zip/*.dwarfs/*.sqfs) are gitignored and must be
        # recreated. mkdwarfs comes from the vcpkg build (dwarfs WITH_TOOLS=ON;
        # build/vcpkg_installed/x64-mingw-static/bin); fixtures are copied into
        # the build tree by CMake at configure time, so configure is re-run
        # afterwards to pick up the fresh ones.
        shell: msys2 {0}
        run: |
          bash tests/fixtures/regenerate_all.sh
          MKDWARFS_DIR=$(dirname "$(ls build/vcpkg_installed/*/bin/mkdwarfs.exe | head -1)")
          PATH="$PWD/$MKDWARFS_DIR:$PATH" bash tests/fixtures/dwarfs/create_fixtures.sh

      - name: Refresh fixtures in build tree
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$(cygpath -m "$VCPKG_ROOT")/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-mingw-static \
            -DVCPKG_INSTALLED_DIR="$(cygpath -m "$GITHUB_WORKSPACE")/build/vcpkg_installed" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Run unit tests
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure --parallel
