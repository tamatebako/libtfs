name: Alpine

on:
  schedule:
    - cron: "0 9 * * 0"
  push:
    branches: [ main, stage-1-modernize-libtfs ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.job }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

env:
  # Pin from vcpkg-configuration.json default-registry baseline
  VCPKG_COMMIT: 11bbc873e00e9e58d4e9dffb30b7a5493a030e0b

jobs:
  build:
    name: alpine-3.21-x86_64 (musl)
    runs-on: ubuntu-latest
    container:
      image: alpine:3.21

    steps:
      - name: Bootstrap container
        # Shell steps run with the container's own shell, so this works before
        # any Node-based action. nodejs + gcompat/libc6-compat let the runner's
        # Node (glibc-linked) execute JavaScript actions on musl; GNU tar is
        # needed by the cache action; zip + squashfs-tools (mksquashfs) are
        # needed by tests/fixtures/regenerate_all.sh.
        run: |
          apk --no-cache --upgrade add \
            bash git curl ca-certificates zip unzip tar gzip \
            nodejs gcompat libc6-compat \
            build-base cmake ninja linux-headers perl python3 \
            autoconf automake libtool pkgconf squashfs-tools

      - name: Declare directory safe
        run: git config --global --add safe.directory "$(pwd)"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          runVcpkgInstall: false

      - name: Cache vcpkg installed tree
        uses: actions/cache@v4
        with:
          path: build/vcpkg_installed
          key: vcpkg-installed-alpine-musl-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlay/**') }}
          restore-keys: vcpkg-installed-alpine-musl-${{ runner.arch }}-

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Regenerate test fixtures
        # Test fixtures (*.zip/*.dwarfs/*.sqfs) are gitignored and must be
        # recreated. mkdwarfs comes from the vcpkg build (dwarfs WITH_TOOLS=ON);
        # fixtures are copied into the build tree by CMake at configure time,
        # so re-run configure to pick up the fresh ones.
        run: |
          bash tests/fixtures/regenerate_all.sh
          MKDWARFS_DIR=$(dirname "$(ls build/vcpkg_installed/*/bin/mkdwarfs | head -1)")
          PATH="$PWD/$MKDWARFS_DIR:$PATH" bash tests/fixtures/dwarfs/create_fixtures.sh
          cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Release

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure --parallel
