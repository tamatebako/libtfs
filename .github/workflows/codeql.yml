name: codeql

on:
  schedule:
    - cron: "0 3 * * 0"
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.job }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

env:
  # Pin from vcpkg-configuration.json default-registry baseline
  VCPKG_COMMIT: 11bbc873e00e9e58d4e9dffb30b7a5493a030e0b
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby' ]
        # Learn more about CodeQL language support at https://aka.ms/codeql-docs/language-support

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: true

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
        runVcpkgInstall: false

    # Per-package ABI cache: port bumps rebuild only the changed port, not the world.
    - name: Cache vcpkg package archives
      uses: actions/cache@v4
      with:
        path: .vcpkg-cache
        key: vcpkg-archives-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg-configuration.json') }}
        restore-keys: vcpkg-archives-${{ runner.os }}-${{ runner.arch }}-

    - name: Cache vcpkg installed tree
      uses: actions/cache@v4
      with:
        path: build/vcpkg_installed
        key: vcpkg-installed-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlay/**') }}
        restore-keys: vcpkg-installed-${{ runner.os }}-${{ runner.arch }}-

    - name: Configure
      run: cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Release -DWITH_TESTS=OFF

    - name: Build
      run: cmake --build build --parallel

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
