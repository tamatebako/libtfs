#
# Release pipeline: fires on version tags (push: v*) and on manual dispatch
# with a tag input (to re-cut a release on an existing tag). Per-platform
# jobs reuse the CI job shape from {ubuntu,alpine,macos,windows}.yml verbatim
# (pinned run-vcpkg, archive+installed caches, fixture regen, ctest), then
# `cmake --install` and package:
#   libtfs-<ver>-<platform>.tar.gz (or .zip on Windows): libtfs.a, public
#     headers (include/tebako/**), CMake package config (lib/cmake/libtfs/)
#   libtfs-deps-<ver>-<platform>.tar.gz: the transitive static libs a consumer
#     links against (dwarfs reader set, flatbuffers, zip, fmt, xxhash, zstd,
#     lz4, lzma, brotli, z, bzip2, boost filesystem+chrono; plus OpenSSL on
#     Linux/Windows) with their CMake package configs — and a curated include/
#     tree (DEPS_HEADER_DIRS/DEPS_HEADER_FILES + the boost subset) so consumers
#     can also compile against the shipped archives (e.g. native gem
#     extensions). The libtfs package plus the matching libtfs-deps package
#     are fully self-contained, so consumers need no vcpkg downstream
#   mkdwarfs-<platform>, tebakofs-<platform> (.exe on Windows)
# The publish job attaches all of them plus SHA256SUMS to the GitHub release.

name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)cut the release for (e.g. v0.12.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  # Never cancel a release mid-publish
  group: 'release-${{ inputs.tag || github.ref_name }}'
  cancel-in-progress: false

env:
  # Pin from vcpkg-configuration.json default-registry baseline
  VCPKG_COMMIT: 11bbc873e00e9e58d4e9dffb30b7a5493a030e0b
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
  # libtfs-deps contract: the exact transitive static libs consumers link
  # against (Linux/Windows builds add libcrypto.a/libssl.a in the packaging
  # step; macOS consumers link brew/system OpenSSL). A missing lib fails the
  # step. Excluded by contract: libarchive, gtest/gmock, argtable3, jemalloc
  # (consumers bring their own), mbedtls, header-only ports (nlohmann-json,
  # parallel-hashmap, range-v3, date, utfcpp), squashfs (LGPL), other boost.
  DEPS_LIBS: >-
    libdwarfs_reader.a libdwarfs_common.a libdwarfs_metadata_legacy.a
    libdwarfs_decompressor.a libflatbuffers.a libzip.a libfmt.a libxxhash.a
    libzstd.a liblz4.a liblzma.a libbrotlidec.a libbrotlienc.a
    libbrotlicommon.a libz.a libbz2.a libboost_filesystem.a libboost_chrono.a
  # CMake package config dirs (share/<port>, or lib/cmake/<port> where a port
  # installs there) shipped with the libs so find_dependency can still
  # resolve; copied only when present (not every port ships a config).
  DEPS_SHARES: >-
    dwarfs flatbuffers libzip fmt xxhash zstd lz4 liblzma unofficial-brotli
    brotli zlib bzip2 boost-filesystem boost-chrono boost_filesystem
    boost_chrono
  # Curated headers shipped under include/ so consumers can compile against
  # the shipped archives (native gem extensions need e.g. <brotli/encode.h>;
  # in the prebuilt world nothing else exposes these headers). Dirs are
  # copied wholesale; a missing entry fails the step like a missing lib.
  # Boost is NOT listed here: it is scoped separately to the transitive
  # include closure of boost_filesystem + boost_chrono (the whole boost/
  # tree is ~100 MB of headers consumers never include).
  DEPS_HEADER_DIRS: >-
    brotli fmt flatbuffers lzma
  DEPS_HEADER_FILES: >-
    zstd.h zstd_errors.h zdict.h lz4.h lz4hc.h lz4frame.h
    lzma.h zlib.h zconf.h bzlib.h zip.h zipconf.h xxhash.h xxh3.h

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # gnu legs build inside the tebako ubuntu-20.04 ci container so the
          # shipped archives never reference glibc symbols newer than the
          # tebako baseline (host runners are glibc 2.38+; packages built
          # there fail to link on ubuntu-20.04, e.g. __isoc23_strtol).
          # Pinned to the ci-containers v0.15.0-rc.1 publish (C++20 toolchain);
          # per-arch sha tags because the rc manifest job did not produce a
          # multi-arch semver index (follow-up: fix manifest plumbing for the
          # 0.15.0 proper publish).
          - platform: linux-gnu-x86_64
            os: ubuntu-latest
            container: ghcr.io/tamatebako/tebako-ubuntu-20.04:sha-59b1b86-amd64
          - platform: linux-gnu-arm64
            os: ubuntu-24.04-arm
            container: ghcr.io/tamatebako/tebako-ubuntu-20.04:sha-59b1b86-arm64
          - platform: linux-musl-x86_64
            os: ubuntu-latest
            container: alpine:3.21
          - platform: macos-arm64
            os: macos-14
          - platform: macos-x86_64
            os: macos-15-intel
          - platform: windows-ucrt64
            os: windows-latest

    steps:
      - name: Bootstrap container (musl)
        # Same bootstrap as alpine.yml: nodejs + gcompat/libc6-compat run the
        # runner's Node actions on musl; GNU tar for the cache action; zip +
        # squashfs-tools for tests/fixtures/regenerate_all.sh; mistletoe for
        # the dwarfs tools man pages.
        if: matrix.platform == 'linux-musl-x86_64'
        run: |
          apk --no-cache --upgrade add \
            bash git curl ca-certificates zip unzip tar gzip \
            nodejs gcompat libc6-compat \
            build-base cmake ninja linux-headers perl python3 py3-pip \
            autoconf automake libtool pkgconf squashfs-tools
          pip3 install --break-system-packages --root-user-action ignore mistletoe

      - name: Declare directory safe (container)
        if: startswith(matrix.platform, 'linux-')
        run: git config --global --add safe.directory "$(pwd)"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Resolve release tag and version
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_ENV"
          echo "version=${TAG#v}" >> "$GITHUB_ENV"

      - name: Install fixture tools (Linux)
        # zip and mksquashfs are needed by tests/fixtures/regenerate_all.sh;
        # unzip/ninja are vcpkg prerequisites the minimal gnu build containers
        # lack (the musl bootstrap installs its own set).
        if: runner.os == 'Linux' && matrix.platform != 'linux-musl-x86_64'
        run: |
          # ubuntu archive fetches flake inside containers on shared runners;
          # retry the whole update+install a few times before giving up
          for i in 1 2 3; do
            sudo apt-get -y update && \
            sudo apt-get -y install zip unzip squashfs-tools ninja-build && break
            echo "apt attempt $i failed; retrying in 20s" && sleep 20
          done

      - name: Upgrade cmake (gnu container legs)
        # The 20.04 gnu ci containers ship cmake 3.24.4; boost-1.90's
        # cmake_minimum_required is 3.25 and vcpkg port builds use the
        # system cmake. Install the xpack 3.31.9 build (same mechanism as
        # ci-containers' tools.sh; the image bump itself is tracked at
        # tamatebako/tebako-ci-containers#67).
        if: startswith(matrix.platform, 'linux-gnu')
        shell: bash
        run: |
          ARCH=$(uname -m); case "$ARCH" in aarch64) ARCH=arm64;; x86_64) ARCH=x64;; esac
          wget -nv "https://github.com/xpack-dev-tools/cmake-xpack/releases/download/v3.31.9-1/xpack-cmake-3.31.9-1-linux-${ARCH}.tar.gz" -O /tmp/cmake.tgz
          # no --skip-old-files: the image's /usr/bin/cmake (3.24.4) is newer
          # by mtime than the tar entries and must be overwritten
          sudo tar -zxf /tmp/cmake.tgz --directory /usr --strip-components=1
          cmake --version | head -1

      - name: Install fixture tools (macOS)
        if: runner.os == 'macOS'
        run: brew install squashfs

      - name: Install mistletoe (macOS)
        # The vcpkg dwarfs build generates tools man pages with the mistletoe
        # Python module; Homebrew python3 is PEP 668 externally-managed.
        if: runner.os == 'macOS'
        run: python3 -m pip install --break-system-packages mistletoe

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          runVcpkgInstall: false

      # Cache keys match the per-platform CI workflows so release jobs reuse
      # the warm caches from main.
      - name: Cache vcpkg package archives (Linux/macOS)
        if: runner.os != 'Windows' && matrix.platform != 'linux-musl-x86_64'
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-archives-${{ runner.os }}-${{ matrix.os }}-${{ hashFiles('vcpkg-configuration.json') }}
          restore-keys: vcpkg-archives-${{ runner.os }}-${{ matrix.os }}-

      - name: Cache vcpkg package archives (musl)
        if: matrix.platform == 'linux-musl-x86_64'
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-archives-alpine-musl-${{ runner.arch }}-${{ hashFiles('vcpkg-configuration.json') }}
          restore-keys: vcpkg-archives-alpine-musl-${{ runner.arch }}-

      - name: Cache vcpkg package archives (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-archives-${{ runner.os }}-${{ runner.arch }}-mingw-${{ hashFiles('vcpkg-configuration.json') }}
          restore-keys: vcpkg-archives-${{ runner.os }}-${{ runner.arch }}-mingw-

      - name: Cache vcpkg installed tree (Linux/macOS)
        if: runner.os != 'Windows' && matrix.platform != 'linux-musl-x86_64'
        uses: actions/cache@v4
        with:
          path: build/vcpkg_installed
          key: vcpkg-installed-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlay/**') }}
          restore-keys: vcpkg-installed-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache vcpkg installed tree (musl)
        if: matrix.platform == 'linux-musl-x86_64'
        uses: actions/cache@v4
        with:
          path: build/vcpkg_installed
          key: vcpkg-installed-alpine-musl-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlay/**') }}
          restore-keys: vcpkg-installed-alpine-musl-${{ runner.arch }}-

      - name: Cache vcpkg installed tree (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: build/vcpkg_installed
          key: vcpkg-installed-${{ runner.os }}-${{ runner.arch }}-mingw-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlay/**') }}
          restore-keys: vcpkg-installed-${{ runner.os }}-${{ runner.arch }}-mingw-

      - name: Setup MSYS2 (UCRT64 toolchain)
        # Same setup as windows.yml: UCRT64 gcc/cmake/ninja plus zip and
        # mksquashfs for fixture regen; dlfcn for include/tebako-pch.h;
        # python-pip for mistletoe.
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: minimal
          update: true
          install: >-
            base-devel
            git
            tar
            zip
            squashfs-tools
          pacboy: >-
            toolchain:p
            ninja:p
            cmake:p
            dlfcn:p
            python-pip:p

      - name: Install mistletoe (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: python3 -m pip install --break-system-packages mistletoe

      - name: Configure (Linux/macOS/musl)
        if: runner.os != 'Windows'
        shell: bash
        # WITH_SQUASHFS=OFF: tebako-facing packages must not force LGPL
        # libsquashfs onto consumers; SquashFS remains opt-in via source builds.
        run: cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Release -DWITH_SQUASHFS=OFF

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        # WITH_SQUASHFS=OFF for the same reason as above (already forced OFF on
        # WIN32; spelled out so the artifact contract is explicit).
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$(cygpath -m "$VCPKG_ROOT")/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-mingw-static \
            -DVCPKG_INSTALLED_DIR="$(cygpath -m "$GITHUB_WORKSPACE")/build/vcpkg_installed" \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_SQUASHFS=OFF

      - name: Build
        if: runner.os != 'Windows'
        shell: bash
        run: cmake --build build --parallel

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --build build --parallel

      - name: Regenerate test fixtures (Linux/macOS/musl)
        # Same as CI: fixtures are gitignored; mkdwarfs comes from the vcpkg
        # build; re-run configure to copy the fresh fixtures into the build tree.
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash tests/fixtures/regenerate_all.sh
          MKDWARFS_DIR=$(dirname "$(ls build/vcpkg_installed/*/bin/mkdwarfs | head -1)")
          PATH="$PWD/$MKDWARFS_DIR:$PATH" bash tests/fixtures/dwarfs/create_fixtures.sh
          cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Release -DWITH_SQUASHFS=OFF

      - name: Regenerate test fixtures (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          bash tests/fixtures/regenerate_all.sh
          MKDWARFS_DIR=$(dirname "$(ls build/vcpkg_installed/*/bin/mkdwarfs.exe | head -1)")
          PATH="$PWD/$MKDWARFS_DIR:$PATH" bash tests/fixtures/dwarfs/create_fixtures.sh

      - name: Refresh fixtures in build tree (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$(cygpath -m "$VCPKG_ROOT")/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-mingw-static \
            -DVCPKG_INSTALLED_DIR="$(cygpath -m "$GITHUB_WORKSPACE")/build/vcpkg_installed" \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_SQUASHFS=OFF

      - name: Run unit tests
        if: runner.os != 'Windows'
        shell: bash
        run: ctest --test-dir build --output-on-failure --parallel

      - name: Run unit tests (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure --parallel

      - name: Install (Linux/macOS/musl)
        if: runner.os != 'Windows'
        shell: bash
        run: cmake --install build --prefix "$PWD/stage"

      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --install build --prefix "$(cygpath -m "$GITHUB_WORKSPACE")/stage"

      - name: Package (Linux/macOS/musl)
        # The tarball mirrors the install prefix: lib/ (libtfs.a,
        # libtebako_dirent_helper_c.a, CMake package config) + include/tebako.
        # mkdwarfs/tebakofs ship as standalone binaries alongside.
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          tar -C stage -czf "artifacts/libtfs-${{ env.version }}-${{ matrix.platform }}.tar.gz" lib include
          cp stage/bin/mkdwarfs "artifacts/mkdwarfs-${{ matrix.platform }}"
          cp stage/bin/tebakofs "artifacts/tebakofs-${{ matrix.platform }}"
          chmod +x artifacts/mkdwarfs-* artifacts/tebakofs-*
          echo "== binary linkage =="
          if [ "$RUNNER_OS" = "macOS" ]; then
            otool -L stage/bin/mkdwarfs stage/bin/tebakofs || true
          else
            ldd stage/bin/mkdwarfs || true
            ldd stage/bin/tebakofs || true
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          cp stage/bin/mkdwarfs.exe "artifacts/mkdwarfs-${{ matrix.platform }}.exe"
          cp stage/bin/tebakofs.exe "artifacts/tebakofs-${{ matrix.platform }}.exe"
          (cd stage && zip -qr "../artifacts/libtfs-${{ env.version }}-${{ matrix.platform }}.zip" lib include)
          echo "== binary DLL dependencies =="
          objdump -p stage/bin/mkdwarfs.exe | grep "DLL Name" || true
          objdump -p stage/bin/tebakofs.exe | grep "DLL Name" || true

      - name: Package deps (Linux/macOS/musl)
        # libtfs-deps-<ver>-<platform>.tar.gz: the transitive static libs a
        # consumer links against (see DEPS_LIBS) plus a curated include/ tree
        # to compile against them (see DEPS_HEADER_DIRS/DEPS_HEADER_FILES and
        # the boost subset below), so libtfs + libtfs-deps is self-contained —
        # no vcpkg downstream. Fails loudly when an expected lib or header is
        # missing. macOS ships no libcrypto/libssl (brew/system OpenSSL at
        # link time); Linux and musl include them.
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          VILIB=$(ls -d build/vcpkg_installed/*/lib | head -1)
          VIROOT=$(dirname "$VILIB")
          LIBS="$DEPS_LIBS"
          SHARES="$DEPS_SHARES"
          HEADER_DIRS="$DEPS_HEADER_DIRS"
          if [ "$RUNNER_OS" != "macOS" ]; then
            LIBS="$LIBS libcrypto.a libssl.a"
            SHARES="$SHARES openssl"
            # Ship the matching OpenSSL headers with the archives: tebako's
            # ruby build (ext/openssl) configures against the triplet include
            # dir; without them it fell back to system headers whose opaque
            # structs mismatched the shipped 3.x libs and broke the build.
            HEADER_DIRS="$HEADER_DIRS openssl"
          fi
          rm -rf deps-stage
          mkdir -p deps-stage/lib deps-stage/share
          resolve() {
            local base="$1" stem f
            stem="${base%.a}"
            case "$base" in
              libz.a)   cand="$VILIB/libz.a $VILIB/libzlib.a" ;;
              libbz2.a) cand="$VILIB/libbz2.a $VILIB/libbzip2.a" ;;
              *)        cand="$VILIB/$base" ;;
            esac
            for f in $cand; do [ -f "$f" ] && { echo "$f"; return 0; }; done
            for f in "$VILIB/${stem}-mt.a" "$VILIB/${stem}"*.a; do
              [ -f "$f" ] && { echo "$f"; return 0; }
            done
            return 1
          }
          for l in $LIBS; do
            src=$(resolve "$l") || { echo "ERROR: expected dep lib missing: $VILIB/$l (incl. variants)" >&2; exit 1; }
            cp "$src" deps-stage/lib/
          done
          for s in $SHARES; do
            if [ -d "$VIROOT/share/$s" ]; then
              cp -R "$VIROOT/share/$s" deps-stage/share/
            fi
            if [ -d "$VILIB/cmake/$s" ]; then
              mkdir -p deps-stage/lib/cmake
              cp -R "$VILIB/cmake/$s" deps-stage/lib/cmake/
            fi
          done
          # Curated headers (DEPS_HEADER_DIRS / DEPS_HEADER_FILES) staged
          # under include/ so consumers can also compile against the shipped
          # archives (gem native extensions need e.g. <brotli/encode.h>).
          VIINC="$VIROOT/include"
          mkdir -p deps-stage/include
          for d in $HEADER_DIRS; do
            if [ ! -d "$VIINC/$d" ]; then
              echo "ERROR: expected dep header dir missing: $VIINC/$d" >&2; exit 1
            fi
            cp -R "$VIINC/$d" deps-stage/include/
          done
          for h in $DEPS_HEADER_FILES; do
            if [ ! -f "$VIINC/$h" ]; then
              echo "ERROR: expected dep header missing: $VIINC/$h" >&2; exit 1
            fi
            cp "$VIINC/$h" deps-stage/include/
          done
          # boost: stage only the transitive #include closure of
          # boost_filesystem + boost_chrono — the whole boost/ tree is
          # ~100 MB of headers consumers never include. MPL's preprocessed
          # headers are seeded explicitly: they are pulled in via
          # macro-computed includes (BOOST_PP_STRINGIZE(...)) that textual
          # scanning cannot follow.
          normalize_boost() {
            local p="$1"
            while [[ "$p" == *"/./"* || "$p" == *"/../"* || "$p" == ../* || "$p" == ./* ]]; do
              p=$(printf '%s' "$p" | sed -E -e 's|(^|/)\./|\1|g' -e 's|[^/]+/\.\./||' -e 's|^\.\./||')
            done
            printf '%s' "$p"
          }
          stage_boost() {
            local rel="$1" src dst inc sub
            src="$VIINC/$rel"
            dst="deps-stage/include/$rel"
            if [ -d "$src" ]; then
              for sub in "$src"/*; do
                [ -e "$sub" ] || continue
                stage_boost "$rel/$(basename "$sub")"
              done
            elif [ -f "$src" ] && [ ! -f "$dst" ]; then
              mkdir -p "$(dirname "$dst")"
              cp "$src" "$dst"
              sed -n -E 's|^[[:space:]]*#[[:space:]]*include[[:space:]]*[<"](boost/[^">]+)[">].*|\1|p' "$dst" |
                while read -r inc; do stage_boost "$inc"; done
              sed -n -E 's|^[[:space:]]*#[[:space:]]*include[[:space:]]*"([^">]+)".*|\1|p' "$dst" |
                while read -r inc; do
                  case "$inc" in
                    boost/*) : ;;
                    *) inc=$(normalize_boost "$(dirname "$rel")/$inc") ;;
                  esac
                  [ -f "$VIINC/$inc" ] && stage_boost "$inc"
                done
            fi
          }
          for seed in boost/filesystem.hpp boost/filesystem boost/chrono.hpp boost/chrono boost/mpl/aux_/preprocessed; do
            if [ ! -e "$VIINC/$seed" ]; then
              echo "ERROR: expected boost seed missing: $VIINC/$seed" >&2; exit 1
            fi
            stage_boost "$seed"
          done
          du -sh deps-stage/include deps-stage/include/boost
          tar -C deps-stage -czf "artifacts/libtfs-deps-${{ env.version }}-${{ matrix.platform }}.tar.gz" lib share include
          tar -tzf "artifacts/libtfs-deps-${{ env.version }}-${{ matrix.platform }}.tar.gz"

      - name: Package deps (Windows)
        # Same deps contract as POSIX — libs and the curated include/ tree
        # (shipped as .tar.gz, not .zip: MSYS2 tar handles it and the asset
        # name stays uniform across platforms); OpenSSL (libcrypto/libssl)
        # is included on Windows.
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          VILIB=$(ls -d build/vcpkg_installed/*/lib | head -1)
          VIROOT=$(dirname "$VILIB")
          LIBS="$DEPS_LIBS libcrypto.a libssl.a"
          SHARES="$DEPS_SHARES openssl"
          rm -rf deps-stage
          mkdir -p deps-stage/lib deps-stage/share
          resolve() {
            local base="$1" stem f
            stem="${base%.a}"
            case "$base" in
              libz.a)   cand="$VILIB/libz.a $VILIB/libzlib.a" ;;
              libbz2.a) cand="$VILIB/libbz2.a $VILIB/libbzip2.a" ;;
              *)        cand="$VILIB/$base" ;;
            esac
            for f in $cand; do [ -f "$f" ] && { echo "$f"; return 0; }; done
            for f in "$VILIB/${stem}-mt.a" "$VILIB/${stem}"*.a; do
              [ -f "$f" ] && { echo "$f"; return 0; }
            done
            return 1
          }
          for l in $LIBS; do
            src=$(resolve "$l") || { echo "ERROR: expected dep lib missing: $VILIB/$l (incl. variants)" >&2; exit 1; }
            cp "$src" deps-stage/lib/
          done
          for s in $SHARES; do
            if [ -d "$VIROOT/share/$s" ]; then
              cp -R "$VIROOT/share/$s" deps-stage/share/
            fi
            if [ -d "$VILIB/cmake/$s" ]; then
              mkdir -p deps-stage/lib/cmake
              cp -R "$VILIB/cmake/$s" deps-stage/lib/cmake/
            fi
          done
          # Curated headers (DEPS_HEADER_DIRS / DEPS_HEADER_FILES) staged
          # under include/ so consumers can also compile against the shipped
          # archives (gem native extensions need e.g. <brotli/encode.h>).
          VIINC="$VIROOT/include"
          mkdir -p deps-stage/include
          for d in $DEPS_HEADER_DIRS; do
            if [ ! -d "$VIINC/$d" ]; then
              echo "ERROR: expected dep header dir missing: $VIINC/$d" >&2; exit 1
            fi
            cp -R "$VIINC/$d" deps-stage/include/
          done
          for h in $DEPS_HEADER_FILES; do
            if [ ! -f "$VIINC/$h" ]; then
              echo "ERROR: expected dep header missing: $VIINC/$h" >&2; exit 1
            fi
            cp "$VIINC/$h" deps-stage/include/
          done
          # boost: stage only the transitive #include closure of
          # boost_filesystem + boost_chrono — the whole boost/ tree is
          # ~100 MB of headers consumers never include. MPL's preprocessed
          # headers are seeded explicitly: they are pulled in via
          # macro-computed includes (BOOST_PP_STRINGIZE(...)) that textual
          # scanning cannot follow.
          normalize_boost() {
            local p="$1"
            while [[ "$p" == *"/./"* || "$p" == *"/../"* || "$p" == ../* || "$p" == ./* ]]; do
              p=$(printf '%s' "$p" | sed -E -e 's|(^|/)\./|\1|g' -e 's|[^/]+/\.\./||' -e 's|^\.\./||')
            done
            printf '%s' "$p"
          }
          stage_boost() {
            local rel="$1" src dst inc sub
            src="$VIINC/$rel"
            dst="deps-stage/include/$rel"
            if [ -d "$src" ]; then
              for sub in "$src"/*; do
                [ -e "$sub" ] || continue
                stage_boost "$rel/$(basename "$sub")"
              done
            elif [ -f "$src" ] && [ ! -f "$dst" ]; then
              mkdir -p "$(dirname "$dst")"
              cp "$src" "$dst"
              sed -n -E 's|^[[:space:]]*#[[:space:]]*include[[:space:]]*[<"](boost/[^">]+)[">].*|\1|p' "$dst" |
                while read -r inc; do stage_boost "$inc"; done
              sed -n -E 's|^[[:space:]]*#[[:space:]]*include[[:space:]]*"([^">]+)".*|\1|p' "$dst" |
                while read -r inc; do
                  case "$inc" in
                    boost/*) : ;;
                    *) inc=$(normalize_boost "$(dirname "$rel")/$inc") ;;
                  esac
                  [ -f "$VIINC/$inc" ] && stage_boost "$inc"
                done
            fi
          }
          for seed in boost/filesystem.hpp boost/filesystem boost/chrono.hpp boost/chrono boost/mpl/aux_/preprocessed; do
            if [ ! -e "$VIINC/$seed" ]; then
              echo "ERROR: expected boost seed missing: $VIINC/$seed" >&2; exit 1
            fi
            stage_boost "$seed"
          done
          du -sh deps-stage/include deps-stage/include/boost
          tar -C deps-stage -czf "artifacts/libtfs-deps-${{ env.version }}-${{ matrix.platform }}.tar.gz" lib share include
          tar -tzf "artifacts/libtfs-deps-${{ env.version }}-${{ matrix.platform }}.tar.gz"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}
          path: artifacts/
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Resolve release tag and version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_ENV"
          echo "version=${TAG#v}" >> "$GITHUB_ENV"

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: dist
          merge-multiple: true

      - name: Verify asset set
        # 6 platforms x 4 assets (libtfs package + libtfs-deps package +
        # mkdwarfs + tebakofs)
        run: |
          ls -l dist
          count=$(find dist -maxdepth 1 -type f | wc -l)
          if [ "$count" -ne 24 ]; then
            echo "ERROR: expected 24 release assets, found $count"
            exit 1
          fi

      - name: SHA256 checksums
        run: |
          chmod +x dist/mkdwarfs-* dist/tebakofs-*
          (cd dist && sha256sum -- * | tee SHA256SUMS)

      - name: Compose release notes
        run: |
          set -euo pipefail
          VERSION="${{ env.version }}"
          # Lift the version's section from CHANGELOG.md (literal header match)
          awk -v hdr="## [$VERSION]" '
            index($0, hdr) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ---

          ## Release artifacts

          Per-platform packages (platform ids: `linux-gnu-x86_64`, `linux-gnu-arm64`,
          `linux-musl-x86_64`, `macos-arm64`, `macos-x86_64`, `windows-ucrt64`):

          - `libtfs-<version>-<platform>.tar.gz` (`.zip` on Windows):
            - `lib/libtfs.a` — the libtfs static library
            - `lib/libtebako_dirent_helper_c.a` — C helper archive (link dependency
              of libtfs where the legacy tebako API is built; not shipped on Windows)
            - `include/tebako/**` — public headers
            - `lib/cmake/libtfs/` — CMake package config (`find_package(libtfs)`)
          - `libtfs-deps-<version>-<platform>.tar.gz` (all platforms): the
            transitive static libraries consumers link against —
            `libdwarfs_reader`, `libdwarfs_common`, `libdwarfs_metadata_legacy`,
            `libdwarfs_decompressor`, `libflatbuffers`, `libzip`, `libfmt`,
            `libxxhash`, `libzstd`, `liblz4`, `liblzma`, brotli (dec/enc/common),
            `libz`, `libbz2`, `libboost_filesystem`, `libboost_chrono`, plus
            `libcrypto`/`libssl` on Linux and Windows (macOS consumers link
            brew/system OpenSSL at link time) — with the CMake package configs
            of those ports under `share/` (or `lib/cmake/` where a port installs
            there), so `find_dependency` can still resolve, and a curated
            header set under `include/` (`brotli/`, `zstd.h`/`zstd_errors.h`/
            `zdict.h`, `lz4*.h`, `lzma.h` + `lzma/`, `zlib.h`/`zconf.h`,
            `bzlib.h`, `fmt/`, `flatbuffers/`, `zip.h`/`zipconf.h`,
            `xxhash.h`/`xxh3.h`, plus the `boost_filesystem`/`boost_chrono`
            subset of `boost/`), so consumers can also compile against the
            shipped archives (e.g. native gem extensions that include
            `<brotli/encode.h>`).
          - `mkdwarfs-<platform>` and `tebakofs-<platform>` — command-line tools
            (`.exe` suffix on `windows-ucrt64`)

          **Self-contained consumption:** a `libtfs-<version>-<platform>`
          package plus the matching `libtfs-deps-<version>-<platform>` package
          are fully self-contained — compiling and linking against `libtfs.a`
          needs no vcpkg (and no C++20 dependency build) on the consumer
          machine, only a compiler, a linker and the platform system libraries
          (plus brew/system OpenSSL on macOS).
          Consumers that prefer to resolve dependencies themselves (e.g. their
          own vcpkg) can keep using the `libtfs` package alone.

          Linkage notes (from the shipped binaries' `ldd`/`objdump` output):

          - All C/C++ third-party dependencies (dwarfs-t, libzip, fmt,
            jemalloc, Boost, …) are statically linked into the binaries on
            every platform.
          - `linux-gnu-*`: dynamic glibc/libstdc++ (built on ubuntu-24.04;
            requires glibc ≥ 2.38 at runtime, e.g. Ubuntu 24.04 or newer).
          - `linux-musl-x86_64`: dynamic musl libc + libstdc++/libgcc_s (built
            on Alpine 3.21; on a minimal Alpine install: `apk add libstdc++ libgcc`).
          - `macos-*`: dynamic macOS system libraries only (libSystem, libc++;
            built on `macos-14` / `macos-15-intel`).
          - `windows-ucrt64`: dynamic UCRT + MSYS2 runtime DLLs
            (`libgcc_s_seh-1.dll`, plus `libwinpthread-1.dll`/`libstdc++-6.dll`
            for mkdwarfs); run inside MSYS2 UCRT64 or ship those DLLs alongside.

          The Windows package ships the modern C/C++ API only (the legacy tebako
          API needs the ruby build context).

          SquashFS: shipped artifacts are built `WITH_SQUASHFS=OFF` — the
          backends are dwarfs + zip only, so consumers are not forced to link
          LGPL squashfs-tools-ng. POSIX source builds may opt into the SquashFS
          backend (LGPL) with `-DWITH_SQUASHFS=ON`.

          SHA-256 checksums for all artifacts: see the `SHA256SUMS` asset.
          EOF
          cat notes.md

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ env.tag }}"
          PRERELEASE_FLAG=""
          case "$TAG" in
            *-*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md $PRERELEASE_FLAG
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release view "$TAG"
