name: coverity

on:
  push:
    branches: [ main, stage-1-modernize-libtfs ]
  pull_request:
    branches: [ main ]

concurrency:
  group: '${{ github.workflow }}-${{ github.job }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

env:
  COVERITY_TOKEN: "MmhAl7FrANiA8oF25A9hEg"
  # Pin from vcpkg-configuration.json default-registry baseline
  VCPKG_COMMIT: 11bbc873e00e9e58d4e9dffb30b7a5493a030e0b

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
        runVcpkgInstall: false

    - name: Cache vcpkg installed tree
      uses: actions/cache@v4
      with:
        path: build/vcpkg_installed
        key: vcpkg-installed-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlay/**') }}
        restore-keys: vcpkg-installed-${{ runner.os }}-${{ runner.arch }}-

    - name: Configure
      run: cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Release -DWITH_TESTS=OFF

    - name: Download Coverity
      run: |
        wget -q https://scan.coverity.com/download/cxx/linux64 --post-data "token=$COVERITY_TOKEN&project=$GITHUB_REPOSITORY" -O cov-analysis-linux64.tar.gz
        mkdir cov-analysis-linux64
        tar xzf cov-analysis-linux64.tar.gz --strip 1 -C cov-analysis-linux64

    - name: Build
      run: |
        set -x
        export PATH="$PWD/cov-analysis-linux64/bin:$PATH"
        cov-build --dir cov-int cmake --build build --parallel

    - name: Submit
      run: |
        tar czvf results.tgz cov-int
        curl \
          --form project=$GITHUB_REPOSITORY \
          --form token=$COVERITY_TOKEN \
          --form email=m.samsonov@computer.org \
          --form file=@results.tgz \
          --form version=$GITHUB_REF \
          --form description=$GITHUB_SHA \
          https://scan.coverity.com/builds?project=$GITHUB_REPOSITORY
